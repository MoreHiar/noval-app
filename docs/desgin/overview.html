<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Noval · 页面设计总览</title><style>
*{box-sizing:border-box}body{margin:0;padding:52px;background:#eeefe9;color:#294336;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:38px}h1{font:34px "Songti SC",serif;letter-spacing:2px;margin:10px 0}header p{font-size:11px;color:#6c7c63;letter-spacing:2px}header a{color:#446044;font-size:12px;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 25px;max-width:1600px;margin:auto}figure{margin:0;min-width:0}figcaption{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px}figcaption span{color:#72806a;font:italic 18px Georgia,serif;margin-right:9px}.frame{aspect-ratio:390/844;overflow:hidden;border:7px solid #fcfcf7;border-radius:32px;box-shadow:0 15px 32px -18px #34482c50;position:relative;background:#f6f3ec}.frame iframe{width:390px;height:844px;border:0;transform-origin:top left;position:absolute;top:0;left:0}footer{font-size:10px;color:#7e8975;letter-spacing:1px;margin-top:40px;text-align:center}@media(max-width:1000px){body{padding:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){body{padding:22px}header{display:block}header a{display:block;margin-top:18px}h1{font-size:27px}.grid{grid-template-columns:1fr;max-width:390px}}
</style></head><body><header><div><p>NOVAL / MOBILE INTERFACE STUDIES</p><h1>故事之外，安静有序。</h1><p>暖纸色与墨绿 · 8 个页面 · 保留现有功能</p></div><a href="index.html">打开可交互设计稿 ↗</a></header><main class="grid" id="grid"></main><footer>设计示意内容 · 正文与封面均为版式示例 · NOVAL DESIGN V1.0</footer><script>
const pages=[['shelf','01','我的书架'],['discover','02','搜索好书'],['detail','03','书籍详情'],['reader','04','沉浸阅读'],['sources','05','书源管理'],['import','06','导入书源'],['edit','07','编辑书源'],['profile','08','我的阅读']];
document.querySelector('#grid').innerHTML=pages.map(([id,n,title])=>`<figure><figcaption><div><span>${n}</span>${title}</div><a href="index.html?screen=${id}" aria-label="查看${title}" style="color:inherit;text-decoration:none">↗</a></figcaption><div class="frame"><iframe title="${title}设计预览" src="index.html?embed=1&screen=${id}" scrolling="no"></iframe></div></figure>`).join('');
const observer=new ResizeObserver(entries=>entries.forEach(({target})=>target.querySelector('iframe').style.transform=`scale(${target.clientWidth/390})`));document.querySelectorAll('.frame').forEach(frame=>observer.observe(frame));
</script></body></html>

<body>
  <div class="workbench">
    <aside class="sidebar">
      <a class="wordmark" href="index.html"><span class="brand-icon">n.</span> noval<span class="version">DESIGN / 01</span></a>

    </aside>
    <main class="workspace">
      <header class="workspace-header"><div><p class="eyebrow">NOVAL — A QUIETER READING SPACE</p><h1>把时间，留给故事。</h1><p class="workspace-subtitle">暖纸色 · 墨绿 · 留白，让每一次翻页都从容。</p></div><span class="edition">移动端页面设计<br>V1.0 / 2026.11</span></header>

      <footer class="workspace-footer"><span>舒适阅读，从清晰的界面开始。</span><span>独立设计原型 · 演示数据</span></footer>
